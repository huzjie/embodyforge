# embodyforge default configuration
# Declared scale (110 robots / 40 DoF / A3 form factor) is informational only;
# the reference instantiates tiny structures.

app:
  name: embodyforge
  version: 1.0.0

kinematics:
  leg_dof: 6
  arm_dof: 7
  n_legs: 2
  n_arms: 2
  thigh_len: 0.4
  shin_len: 0.4
  torso_len: 0.5
  ik_max_iter: 60
  ik_damping: 0.05
  ik_tol: 0.001

dynamics:
  mass_kg: 50.0
  com_height: 0.8
  gravity: 9.81
  support_radius: 0.12

