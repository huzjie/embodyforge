embodied:
  n_skills: 16
  n_primitives: 8
  obs_dim: 32
  temperature: 0.8
  learning_rate: 0.2
  max_steps: 40

serving:
  host: 127.0.0.1
  port: 8322

train:
  learning_rate: 0.2
  max_steps: 40
  seed: 20261025

bench:
  n_tasks: 200
  n_steps: 64
  seed: 20261025

declared:
  n_robots: 110
  dof_per_robot: 40
